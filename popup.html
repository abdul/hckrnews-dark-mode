<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HckrNews Dark Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <img src="icon48.png" class="logo" alt="Logo" />
        <h1>HckrNews<br>Dark Mode</h1>
        <div class="subtitle">for hckrnews.com</div>
        <h1>Theme Picker</h1>
        <div class="subtitle">Choose your code-inspired style!</div>
        <label for="themeSelect">Theme:</label>
        <select id="themeSelect">
            <option value="default">Default</option>
            <option value="solarizedDark">Solarized Dark</option>
            <option value="tomorrowNight">Tomorrow Night</option>
            <option value="dracula">Dracula Official</option>
            <option value="nightOwl">Night Owl</option>
            <option value="oneDarkPro">One Dark Pro</option>
            <option value="tokyoNight">Tokyo Night</option>
            <option value="moonlight">Moonlight</option>
            <option value="cyberpunk2077">2077</option>
            <option value="cobalt2">Cobalt2</option>
            <option value="noctis">Noctis</option>
            <option value="catppuccin">Catppuccin</option>
            <option value="monokaiPro">Monokai Pro</option>
        </select>
        <div class="status-bar" id="statusBar"></div>
    <div class="info-section">
        💡 Your preference is saved automatically and will persist across sessions.
    </div>
    <div class="links">
        <a href="https://abdulqabiz.com" target="_blank">Author</a>
        <a href="https://github.com/abdul" target="_blank">GitHub</a>
        <a href="https://github.com/abdul/hckrnews-dark-mode" target="_blank">Repo</a>
    </div>
    <div class="version">v1.0.1</div>
</div>
<script src="popup.js"></script>
</body>
</html>
